<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Knit With Muat is an instructional knitting website for begginers to learn basic stitches and more advanced knitters to get patterns">
    <meta name="keywords" content="knitting, learn, pattern, stitch, yarn, knit">
    <title>Knit With Muat</title>
    <script src="https://kit.fontawesome.com/8e98b6be0c.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
    </style>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!---navigation bar-->
    <header>
        <a href="index.html">
            <h1 id="logo">Knit With Muat</h1>
        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" id="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>
        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="patterns.html" class="active">Patterns</a></li>
                <li><a href="learn-to-knit.html">Learn to Knit</a></li>
            </ul>
        </nav>
    </header>

    <!--pattern boxes -->

    <main>
        <h2 id="pattern-title">Knitting Patterns:</h2>
        <section id="patterns">

            <div id="pattern-boxes">
                <!--rib-->
                <div class="pattern-box" id="basic-rib" onclick="window.location.href='basic-rib.html'">
                    <h3>Basic Rib</h3>
                </div>
                <!--cable-->
                <div class="pattern-box" id="basic-cable" onclick="window.location.href='basic-cable.html'">
                    <h3>Basic Cable</h3>
                </div>
                <!--embossed slip stitch-->
                <div class="pattern-box" id="embossed-slip-stitch"
                    onclick="window.location.href='embossed-slip-stitch.html'">
                    <h3>Embossed Slip Stitch</h3>
                </div>
                <!--cable and rib-->
                <div class="pattern-box" id="cable-and-rib" onclick="window.location.href='cable-and-rib.html'">
                    <h3>Cable and Rib</h3>
                </div>
                <!--platted cable stitch-->
                <div class="pattern-box" id="platted-cable-stitch"
                    onclick="window.location.href='platted-cable-stitch.html'">
                    <h3>Platted Cable Stitch</h3>
                </div>
                <!--girls wing pattern-->
                <div class="pattern-box" id="girls-wing-pattern"
                    onclick="window.location.href='girls-wing-pattern.html'">
                    <h3>Girls Wing Pattern</h3>
                </div>
                <!--double moss stitch-->
                <div class="pattern-box" id="double-moss-stitch"
                    onclick="window.location.href='double-moss-stitch.html'">
                    <h3>Double Moss Stitch</h3>
                </div>
                <!--basket stitch-->
                <div class="pattern-box" id="basket-stitch" onclick="window.location.href='basket-stitch.html'">
                    <h3>Basket Stitch</h3>
                </div>
            </div>

        </section> 
    
    </main>


    <!-- footer -->
    <footer>
        <p>&copy; 2026 Knit With Muat. All rights reserved.</p>
    </footer>
</body>

</html>
